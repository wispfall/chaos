<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chaos→internal Romanization</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #050505;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 满屏随机乱码背景 */
        .glitch-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.12; font-size: 14px; line-height: 1.1;
            word-wrap: break-word; z-index: 1; pointer-events: none; text-align: justify;
        }

        /* 中心区域 */
        .center-wrap {
            position: relative; z-index: 10;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            width: 100%;
        }

        /* 故障文字「ハテ」 */
        .glitch-text {
            font-size: 8rem; font-weight: 900; letter-spacing: 15px;
            color: transparent; -webkit-text-stroke: 2px #fff;
            text-shadow: 4px 0 0 rgba(255, 0, 0, 0.8), -4px 0 0 rgba(0, 255, 255, 0.8);
            z-index: 50; animation: text-shake 0.2s infinite;
            position: relative; margin-bottom: 20px;
        }

        /* 遮挡黑块 */
        .blocker {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 120%; height: 2.2rem;
            background-color: rgba(5, 5, 5, 0.98);
            z-index: 20; display: flex; align-items: center;
            overflow: hidden; border-top: 1px solid #222; border-bottom: 1px solid #111;
            box-shadow: 0 0 20px #000;
            transition: all 1s ease;
        }

        /* 滚动报错文本（时间到了之后不再滚动，且可被选中） */
        .blocker::before {
            content: "ERR_0x8F2C::ハテ_OVERRIDE_FAILED >> [SEGFAULT: CORE_DUMPED] >> ADDR_0xDEADBEEF >> NEXT_NODE_DETECTED: /hate >> MEM_LEAK_DETECTED >> ";
            color: #ff003c; font-size: 1rem; white-space: nowrap;
            animation: slide-error 4s linear infinite;
            text-shadow: 0 0 5px #ff003c; 
            user-select: text; /* 允许玩家长按选中 */
        }

        /* 当玩家长按选中黑条里的文字时，变成极其刺眼的亮白色 */
        .blocker::before::selection {
            background: #ff003c;
            color: #fff;
            text-shadow: 0 0 10px #fff;
        }

        /* 时间到后才出现的线索（极其黯淡，长按才能看清） */
        #secret-clue {
            display: none;
            margin-top: 80px;
            color: #111; /* 和背景颜色一模一样，完全隐形 */
            font-size: 0.9rem;
            letter-spacing: 3px;
            user-select: text; /* 允许选中 */
            z-index: 100;
            transition: color 0.3s;
        }

        /* 线索被选中时显示真身 */
        #secret-clue::selection {
            color: #ff003c;
            background: transparent;
        }

        /* 屏幕扫描线 */
        .scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0) 50%, rgba(0,0,0,0.4) 50%);
            background-size: 100% 6px; z-index: 30; pointer-events: none;
        }

        @keyframes text-shake {
            0% { transform: translate(0, 0) skewX(0deg); }
            20% { transform: translate(-3px, 2px) skewX(4deg); }
            40% { transform: translate(3px, -1px) skewX(-4deg); }
            60% { transform: translate(-2px, -2px) skewX(2deg); }
            80% { transform: translate(2px, 2px) skewX(-2deg); }
            100% { transform: translate(0, 0) skewX(0deg); }
        }
        @keyframes slide-error {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>
    <!-- 乱码背景 -->
    <div class="glitch-bg" id="bg"></div>

    <!-- 故障中心 -->
    <div class="center-wrap">
        <div class="glitch-text" id="glitch-text">ハテ</div>
        <div class="blocker" id="blocker"></div>
        
        <!-- 隐藏线索 -->
        <div id="secret-clue">ending-?skip.nano-324539</div>
    </div>

    <!-- 扫描线 -->
    <div class="scanlines"></div>

    <script>
        // 生成乱码
        const bg = document.getElementById('bg');
        const chars = "ハテ系统故障エラー混沌▓▒░█接続失敗0x7F1A@#$%&*+=<>?/\\|~^_-::{[]}0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZデータ破損核心崩壊アクセス拒否█▀▄■□▪▫◈";
        let text = "";
        for (let i = 0; i < 4000; i++) {
            text += chars[Math.floor(Math.random() * chars.length)];
            if (i % 70 === 0) text += "<br>";
        }
        bg.innerHTML = text;

        // 检查时间
        function checkFinalTime() {
            const now = new Date();
            // 设定解锁时间：11月18日 00:00:00
            const targetDate = new Date(2026, 10, 18); 
            
            if (now >= targetDate) {
                // 1. 让黑条不再滚动（静止）
                const blocker = document.getElementById('blocker');
                blocker.style.setProperty('--anim', 'none');
                
                // 用 JS 直接关掉伪元素的动画
                const styleSheet = document.styleSheets[0];
                // 找到 slide-error 动画并将其暂停
                for (let i = 0; i < styleSheet.cssRules.length; i++) {
                    if (styleSheet.cssRules[i].name === 'slide-error') {
                        styleSheet.cssRules[i].style.animation = 'none';
                    }
                }

                // 2. 改变黑条里的文字，不再滚动，提示玩家长按
                blocker.innerHTML = `<span style="color: #555; font-size: 0.8rem; white-space: nowrap; overflow: hidden; display: block; text-align: center; width: 100%;">[ 尝试长按并选中此区域 ]</span>`;

                // 3. 显示极其黯淡的线索
                const clue = document.getElementById('secret-clue');
                clue.style.display = 'block';
            }
        }
        
        checkFinalTime();
    </script>
</body>
</html>
